<main class="min-h-screen bg-[#FAFAFA] text-neutral-900 font-sans selection:bg-[#FF3300]/20 selection:text-[#FF3300]">
  <!-- Splash Intro Cinematic Modal -->
  @if (showSplash()) {
    <app-splash-intro (animationCompleted)="onSplashCompleted()" />
  }

  <!-- View 1: Hoy (Tu Ritmo Diario) -->
  @if (activeTab() === 'hoy') {
    <app-hoy
      (addActivityClick)="openCreateActivity()"
      (editActivityClick)="openEditActivity($event)"
    />
  }

  <!-- View 2: Crear / Editar Actividad -->
  @if (activeTab() === 'crear') {
    <app-crear-actividad
      [editActivity]="selectedActivityForEdit()"
      (formSaved)="onActivitySaved()"
      (cancel)="onTabChange('hoy')"
      (openAlarmConfig)="openAlarmFromCreate()"
    />
  }

  <!-- View 3: Configurar Alarma -->
  @if (activeTab() === 'alarmas') {
    @if (selectedActivityForAlarm()) {
      <app-configurar-alarma
        [actividad]="selectedActivityForAlarm()!"
        (configSaved)="onAlarmConfigSaved()"
      />
    } @else {
      <div class="py-20 px-4 text-center text-neutral-500">
        <p class="text-sm font-medium">Selecciona una actividad desde la vista Hoy para personalizar su alarma.</p>
        <button
          type="button"
          (click)="onTabChange('hoy')"
          class="mt-3 px-4 py-2 bg-black text-white text-xs font-bold rounded-xl"
        >
          Volver a Hoy
        </button>
      </div>
    }
  }

  <!-- View 4: Resumen Semanal -->
  @if (activeTab() === 'resumen') {
    <app-resumen />
  }

  <!-- Fixed Bottom Navigation Bar -->
  <app-bottom-nav
    [activeTab]="activeTab()"
    (tabChange)="onTabChange($event)"
  />
</main>
