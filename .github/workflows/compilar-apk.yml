name: Compilar APK Lumos

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Instalar Android SDK 36 y Aceptar Licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Instalar Dependencias del Proyecto
        run: npm ci --legacy-peer-deps

      - name: Inyectar Credenciales de Entorno (.env y google-services.json)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf "%s\n" "$ENV_FILE_CONTENT" > .env
            echo "✅ Archivo .env restaurado desde GitHub Secrets"
          fi
          if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
            printf "%s\n" "$GOOGLE_SERVICES_CONTENT" > android/app/google-services.json
            if node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8'))" 2>/dev/null; then
              echo "✅ Archivo google-services.json válido restaurado desde GitHub Secrets"
            else
              echo "⚠️ El secreto GOOGLE_SERVICES_JSON no contiene un JSON válido. Omitiendo para no interrumpir la compilación..."
              rm -f android/app/google-services.json
            fi
          fi

      - name: Compilar Frontend Angular
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Sincronizar Plataforma Android Capacitor
        run: npx cap sync android

      - name: Otorgar Permisos de Ejecución a Gradlew
        run: chmod +x ./android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Mostrar Log de Error de Gradle
        if: failure()
        run: |
          MSG=$(tail -n 12 gradle-build.log | tr -d '\r' | tr '\n' ' ')
          echo "::error::$MSG"
          tail -n 60 gradle-build.log

      - name: Subir Log de Gradle si Falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Publicar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: lumos-agenda-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
